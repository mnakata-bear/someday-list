# GitHub Pages へデプロイ(main に push したとき / 手動実行)
# リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 合言葉(secret APP_PASSPHRASE)から、アプリの置き場所 app-<slug>/ を決める。
      # 合言葉も slug もログに出さない(secret は自動で、slug は add-mask で伏せ字になる)
      - name: 合言葉から置き場所を計算
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
        run: |
          if [ -z "$APP_PASSPHRASE" ]; then echo "::error::secret APP_PASSPHRASE が未設定です"; exit 1; fi
          SLUG="$(node scripts/slug.mjs)"
          echo "::add-mask::$SLUG"
          echo "APP_SLUG=$SLUG" >> "$GITHUB_ENV"
      # 入口ページを dist 直下(/someday-list/)、アプリを dist/app-<slug>/ にビルドして 1 つにまとめる
      - name: ビルド(入口ページ+アプリ)
        run: node scripts/build-pages.mjs
        env:
          OUT_DIR: dist
          # Firebase の Web config はリポジトリの Variables(Settings → Secrets and variables → Actions)から渡す
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 公開用ファイル一式(中にアプリの置き場所 app-<slug>/ がある)を、公開が終わったらすぐ消す。
      # public リポジトリでは、この一式を誰でもダウンロードできてしまうため
      - name: 公開用の一式を削除
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
